# TCM Knowledge Graph - Docker Compose Configuration
version: "3.8"

services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.26-community
    container_name: tcm-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tcm_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    networks:
      - tcm-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # TCM Knowledge Graph API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tcm-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-tcm_password}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen-plus}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../data:/app/data
    networks:
      - tcm-network
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # Development API service with hot reload
  api-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: tcm-api-dev
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-tcm_password}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen-plus}
      - LOG_LEVEL=DEBUG
    volumes:
      - ../src:/app/src:ro
      - ../data:/app/data
    networks:
      - tcm-network
    depends_on:
      neo4j:
        condition: service_healthy
    profiles:
      - dev

volumes:
  neo4j_data:
    name: tcm-neo4j-data
  neo4j_logs:
    name: tcm-neo4j-logs
  neo4j_import:
    name: tcm-neo4j-import

networks:
  tcm-network:
    name: tcm-network
    driver: bridge
