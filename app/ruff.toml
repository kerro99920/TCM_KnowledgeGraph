# Ruff configuration for TCM Knowledge Graph project

# Target Python version
target-version = "py311"

# Line length
line-length = 100

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "dist",
    "build",
    "*.egg-info",
    "data",
]

[lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
]

# Ignore specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments (common in config classes)
    "PLR2004", # Magic value comparison
    "S101",    # Assert used (OK in tests)
    "B008",    # Function call in default argument (needed for FastAPI Depends)
]

# Per-file ignores
[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Assert allowed in tests
    "ARG001",  # Unused function arguments (fixtures)
    "PLR2004", # Magic values OK in tests
]
"src/tcm_kgraph/cli/**/*.py" = [
    "B008",    # Function call in default argument (Typer pattern)
]
"src/tcm_kgraph/api/**/*.py" = [
    "B008",    # Function call in default argument (FastAPI Depends)
]

[lint.isort]
known-first-party = ["tcm_kgraph"]
force-single-line = false
lines-after-imports = 2

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[format]
# Use double quotes
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix line endings
line-ending = "lf"

# Enable auto-formatting of docstrings
docstring-code-format = true
